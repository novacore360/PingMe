workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      groups:
        - supabase_credentials  # Optional: store keys securely
      vars:
        PACKAGE_NAME: "com.messagingapp"
      java: 17
    scripts:
      - name: Build Android APK
        script: |
          ./gradlew assembleDebug --no-daemon
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - your-email@example.com
